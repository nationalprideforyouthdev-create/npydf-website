<style>
:root{--g:#0a5c2e;--gold:#f5c518;--ink:#17231b;--muted:#64736a;--bg:#f5f7f5;--line:#e0e8e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,Arial}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:750;background:var(--g);color:white}.gold{background:var(--gold);color:#17230f}.light{background:#e8f2e9;color:var(--g)}.wrap{width:min(1100px,92%);margin:auto}.header{position:sticky;top:0;background:#fffffff2;backdrop-filter:blur(10px);z-index:4;border-bottom:1px solid var(--line)}.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}.brand{display:flex;align-items:center;gap:10px;color:var(--g);font-weight:900;line-height:1.2}.logo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:white;font-size:1.25rem}.brand small{display:block;font-weight:550;color:var(--muted);font-size:.7rem}.drawer{position:fixed;inset:0 0 0 auto;width:min(360px,88vw);background:#073d20;color:white;z-index:8;overflow:auto;padding:20px;transform:translateX(105%);transition:.25s}.drawer.open{transform:translateX(0)}.drawer button{display:block;width:100%;text-align:left;background:transparent;color:white;padding:10px;border-bottom:1px solid #ffffff20}.drawer button:hover{color:var(--gold)}.shade{position:fixed;inset:0;background:#0007;z-index:7;display:none}.shade.show{display:block}.hero{background:linear-gradient(120deg,#064521,#0a5c2e,#178143);color:white;padding:65px 0}.hero h1{font-size:clamp(2.2rem,7vw,4.4rem);line-height:1.08;margin:12px 0;max-width:800px}.hero p{max-width:700px;color:#e3efe6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.actions button.alt{background:transparent;border:1px solid #ffffff80}.page{display:none;min-height:65vh;padding:32px 0 50px}.page.active{display:block}.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin:10px 0;box-shadow:0 5px 16px #0b28120a}.stat strong{font-size:2rem;color:var(--g);display:block}.muted{color:var(--muted)}h1,h2,h3{line-height:1.2;color:var(--g)}.hero h1{color:white}.tag{display:inline-block;background:#fff2bd;padding:5px 10px;border-radius:20px;font-size:.8rem;font-weight:750;color:#594800}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:6px 0}.field.full{grid-column:1/-1}label{display:block;font-weight:750;font-size:.85rem;margin-bottom:5px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd8ce;border-radius:10px;background:white}textarea{min-height:95px}.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-top:35px}.pager button{background:var(--gold);color:#17230f}.footer{background:#08351c;color:white;padding:30px 0}.footer p{color:#d3e3d6}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{background:#eaf3eb}.badge{padding:4px 8px;border-radius:16px;background:#edf5ee;color:var(--g);font-size:.8rem}.bad{background:#fee8e8;color:#8b2222}.warn{background:#fff2bd;color:#665000}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.adminnav button{background:#e7f0e8;color:var(--g);padding:9px 12px}.adminnav button.active{background:var(--g);color:white}.hidden{display:none!important}.toast{padding:12px;background:#e7f4e9;border-radius:10px;color:#155b2b}.anthem{background:var(--g);color:white;padding:25px;border-radius:16px;white-space:pre-line}.photo{min-height:140px;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#d4ead7,#f6e5a9);border-radius:14px;padding:20px;font-size:2rem}.small{font-size:.85rem}@media(max-width:600px){.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:46px 0}.page{padding-top:22px}.headrow{padding:8px 0}.pager button{flex:1}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header class="header"><div class="wrap headrow"><div class="brand"><div class="logo">N</div><div>NPYDF CHIPATA<small>National Pride for Youth Development Foundation</small></div></div><button class="gold" onclick="toggleMenu()">☰ Menu</button></div></header>
<div class="shade" id="shade" onclick="toggleMenu(false)"></div><nav class="drawer" id="drawer"><button onclick="toggleMenu(false)">✕ Close menu</button><div id="menuItems"></div></nav>
<main class="wrap" id="pages"></main><footer class="footer"><div class="wrap"><b>NPYDF Chipata</b><p>Building a pride of empowered youths. One youth at a time.</p><p>Chipata, Eastern Province, Zambia · +260 77 1319147 · info@npydf.org.zm</p><small>© 2026 NPYDF Chipata</small></div></footer>
<script>
const publicPages=[['home','Home'],['impact','Impact Report 2026'],['stories','Success Stories'],['about','About'],['projects','Projects'],['leadership','Leadership'],['membership','Membership'],['anthem','Anthem'],['news','News'],['gallery','Gallery'],['review','Annual Review'],['partnership','Partnership'],['donate','Donate'],['contact','Contact']];
const adminPages=['Dashboard','Members','Finance','HRM','55 Forms','News','Gallery','Docs','Messages','Projects'];
let page='home',admin=false,adminView='Dashboard',user=null;const store='npydf_webapp_data';let data=JSON.parse(localStorage.getItem(store)||'null')||{members:[],submissions:[],finance:[],staff:[],contracts:[],payslips:[],leave:[],news:[],gallery:[],docs:[],messages:[],projects:[]};function save(){localStorage.setItem(store,JSON.stringify(data))}
const projects=[['Pride Pathways','Artness Banda','Tailoring, practical skills, enterprise and mentorship'],['Pride Lady','Yvonne Mumba','Girls mentorship across Chipata Day, Hillside Girls, Anoya Zulu, Kapata and Mchini'],['Pride Farms','Victor Mwale','Farmer support in Kasenengwa'],['Innovation Hub','Marcell Banda','Digital skills and repair training in Chipata Town'],['Pride Works','Memory Lungu','Community clean-ups and tree planting']];
const wards=['Chipata Central','Kapata','Mchini','Nabvutika','Chimwemwe','Chinjala','Kasenengwa','Madzimoyo','Msanga','Walela'];
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleMenu(force){let on=force===undefined?!document.getElementById('drawer').classList.contains('open'):force;document.getElementById('drawer').classList.toggle('open',on);document.getElementById('shade').classList.toggle('show',on)}
function go(p){admin=false;page=p;toggleMenu(false);render()}
function goAdmin(){admin=true;adminView='Dashboard';toggleMenu(false);render()}
function navMenu(){document.getElementById('menuItems').innerHTML=publicPages.map(([id,n])=>'<button onclick="go(\''+id+'\')">'+n+'</button>').join('')+'<button onclick="goAdmin()">🔐 Admin Login</button>'}
function pageNav(){let idx=publicPages.findIndex(x=>x[0]===page);let prev=idx<=0?null:publicPages[idx-1],next=idx>=publicPages.length-1?null:publicPages[idx+1];return '<div class="pager">'+(prev?'<button onclick="go(\''+prev[0]+'\')">← Back: '+prev[1]+'</button>':'<span></span>')+(next?'<button onclick="go(\''+next[0]+'\')">Next: '+next[1]+' →</button>':'<span></span>')+'</div>'}
function panel(title,body){return '<div class="panel"><h3>'+title+'</h3>'+body+'</div>'}
function form(fields,submit,label){return '<form onsubmit="'+submit+'(event)" class="panel"><div class="fields">'+fields.map(f=>'<div class="field '+(f[2]?'full':'')+'"><label>'+esc(f[0])+'</label>'+(f[1]==='textarea'?'<textarea name="'+esc(f[0])+'" required></textarea>':f[1].startsWith('select:')?'<select name="'+esc(f[0])+'" required>'+f[1].slice(7).split('|').map(v=>'<option>'+esc(v)+'</option>').join('')+'</select>':'<input name="'+esc(f[0])+'" type="'+esc(f[1]||'text')+'" required>')+'</div>').join('')+'</div><button>'+label+'</button></form>'}
function render(){navMenu();let root=document.getElementById('pages');if(admin){root.innerHTML=adminRender();return}let html='';
if(page==='home')html='<section class="hero"><div class="eyebrow">National Pride for Youth Development Foundation · Chipata</div><h1>Building a pride of empowered youths. One youth at a time.</h1><p>From 21 members to 127 lives touched — Kapata to Kasenengwa.</p><div class="actions"><button class="gold" onclick="go(\'membership\')">Join Us</button><button class="alt" onclick="go(\'impact\')">See Our Impact</button><button class="alt" onclick="go(\'stories\')">Read Success Stories</button><button class="gold" onclick="go(\'donate\')">Donate</button></div></section><div class="stats">'+stat('127','Youth Empowered')+stat('68','Girls Mentored')+stat('5','Projects')+stat('320','Trees Planted')+'</div>'+panel('Grace Phiri · Pride Pathways','<p>“I finished Grade 12 in Kapata with no job. Artness Banda taught me tailoring. Today I sew uniforms for 3 schools and make K1,500 per month.”</p>')+panel('Our five projects',projectCards())+panel('Leadership','<h3>Francis Banda</h3><p>Chairperson / Executive Director</p><button class="light" onclick="go(\'leadership\')">Meet the team</button>')+panel('Latest news',newsList())';
if(page==='impact')html='<h1>Our Impact In Chipata — In Numbers</h1><div class="stats">'+[['127','Youth Empowered'],['68','Girls Mentored'],['42','Skills Trained'],['35','Farmers Supported'],['320','Trees Planted'],['9','Clean-Ups Done'],['28','Bags Maize Harvested'],['38','Digital Skills Trained'],['7','Schools Reached']].map(x=>stat(x[0],x[1])).join('')+'</div>'+panel('2026 story','<p>In 2026, NPYDF started with 21 members. Today we have touched 127 lives — from Kapata to Kasenengwa.</p>')+panel('Where we worked','<div class="tablewrap"><table><tr><th>Community</th><th>Activity</th></tr><tr><td>Chinjala Central</td><td>Base</td></tr><tr><td>Kapata Market</td><td>Clean-Up + Skills</td></tr><tr><td>Mchini</td><td>Girls Talk + Digital</td></tr><tr><td>Chipata Central</td><td>Innovation Hub</td></tr><tr><td>Kasenengwa</td><td>Farms</td></tr><tr><td>Madzimoyo / Msanga</td><td>Farming</td></tr></table></div>')';
if(page==='stories')html='<h1>Real People, Real Chipata</h1>'+[['Grace Phiri, 22 · Kapata · Pride Pathways','Before: No job','After: Own business, 3 customers, training 2 girls, K1,500/month'],['Mercy Zulu, 16 · Chipata Day · Pride Lady','Before: Almost dropped out','After: Top 10, Ambassador, wants to be nurse'],['Victor Mwale, 27 · Kasenengwa · Pride Farms','Before: 0 bags','After: 28 bags, K4,200 sales, poultry starting'],['Daniel Banda, 19 · Chipata Central · Innovation Hub','Before: No skills','After: Phone repair, K80–K150 per phone, own tools'],['Memory Lungu, 24 · Chinjala · Pride Works','Before: Dirty market','After: 9 clean-ups, 320 trees'],['Francis Banda, 32 · ED','Before: “We had 21 people, no money, no office.”','After: Building an organisation']].map(x=>panel(x[0],'<b>'+x[1]+'</b><p>'+x[2]+'</p>')).join('')+panel('Community voices','<p>Head Teacher · Kapata Market Chairman · Mother from Mchini</p><p>Community members share how youth-led skills, mentorship and service have strengthened their communities.</p>')';
if(page==='about')html='<h1>Who We Are</h1>'+panel('Vision','<h3>A proud, skilled, self-reliant generation.</h3>')+panel('Mission','To empower young people through skills development, mentorship, livelihoods, innovation, environmental stewardship and community action.')+panel('Our Motto','Building a pride of empowered youths. One youth at a time.')+panel('Our communities',wards.join(' · '));
if(page==='projects')html='<h1>Our Projects</h1><div class="actions">'+projects.map(x=>'<button class="light" onclick="document.getElementById(\'p'+projects.indexOf(x)+'\').scrollIntoView()">'+x[0]+'</button>').join('')+'</div>'+projects.map((x,i)=>'<div class="panel" id="p'+i+'"><h2>'+x[0]+'</h2><b>Project Lead: '+x[1]+'</b><p>'+x[2]+'</p></div>').join('');
if(page==='leadership')html='<h1>Leadership & Governance</h1>'+panel('Executive team','<div class="grid">'+['Francis Banda — ED','Ishmael Banda — Vice','Artness Banda — Secretary','Yvonne Mumba — Vice Secretary','Annie Mwanza — Treasurer','Victor Mwale — Vice Treasurer','Marcell Banda — Executive','Memory Lungu — Executive','Executive 9','Executive 10'].map(x=>'<div class="card"><b>'+x+'</b></div>').join('')+'</div>')+panel('Workflow','Submitted By → Secretary → ED Francis Banda → Treasurer');
if(page==='membership')html='<h1>Membership Application</h1><p>Join NPYDF Chipata and become part of youth-led change.</p>'+form([['Name','text'],['Phone','tel'],['NRC','text'],['Ward','select:'+wards.join('|')],['Project','select:'+projects.map(x=>x[0]).join('|')],['Why join','textarea',true]],'memberSubmit','Submit membership application');
if(page==='anthem')html='<h1>NPYDF Anthem</h1><div class="anthem"><h2 style="color:#f5c518">We are the pride of Chipata</h2><p>We are the pride of Chipata,\nYoung hearts, strong minds, united we stand.\nWith skills and hope in our hands,\nWe build a brighter future for our land.\n\nOne youth at a time, one dream at a time,\nTogether we rise, together we shine.\nNational Pride, our banner high,\nWe serve our people, reach for the sky.\n\nFrom Kapata to Kasenengwa,\nOur voices ring, our purpose clear.\nWe learn, we lead, we work, we care,\nNPYDF, our pride is here!</p></div>';
if(page==='news')html='<h1>News & Updates</h1>'+newsList()+panel('Suggest news',form([['Headline','text'],['Your name','text'],['News / story','textarea',true]],'newsSubmit','Submit story suggestion'));
if(page==='gallery')html='<h1>Gallery</h1><div class="grid">'+['Youth Skills','Girls Mentorship','Community Farms','Digital Innovation','Market Clean-Up','Tree Planting'].map((x,i)=>'<div class="card"><div class="photo">'+['🌱','👩🏽‍🎓','🌽','💻','🧹','🌳'][i]+'</div><h3>'+x+'</h3><p>NPYDF activity photo placeholder</p></div>').join('')+'</div>';
if(page==='review')html='<h1>Annual Review 2026</h1>'+panel('Year summary','<div class="tablewrap"><table><tr><th>Indicator</th><th>2026</th></tr>'+[['Members','21'],['Executives','10'],['Projects','5'],['Youth reached','127'],['Wards','10'],['ED','Francis Banda']].map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join('')+'</table></div>');
if(page==='partnership')html='<h1>Partner With Us</h1><p>We welcome schools, churches, businesses, NGOs, government and individuals.</p>'+form([['Partner name','text'],['Partner type','select:School|Church|Business|NGO|Government|Individual'],['Phone / email','text'],['Area of interest','textarea',true]],'partnerSubmit','Submit partnership request');
if(page==='donate')html='<h1>Support Youth Empowerment</h1><div class="actions">'+[100,250,500,1000,2500].map(n=>'<button class="gold" onclick="document.getElementById(\'amount\').value='+n+'">K'+n.toLocaleString()+'</button>').join('')+'</div>'+form([['Donation amount (K)','number'],['Project','select:'+projects.map(x=>x[0]).join('|')],['Name (optional)','text'],['Message','textarea',true]],'donateSubmit','Record donation pledge')+'<p class="muted">This form records a pledge/enquiry; it does not process online payments.</p>';
if(page==='contact')html='<h1>Contact Us</h1>'+panel('NPYDF Chipata','<p>Chipata, Eastern Province, Zambia</p><p>Phone: +260 77 1319147</p><p>Email: info@npydf.org.zm</p><a href="https://wa.me/260771319147"><button class="gold">Message us on WhatsApp</button></a>')+form([['Name','text'],['Phone / email','text'],['Subject','text'],['Message','textarea',true]],'contactSubmit','Send message');
root.innerHTML='<div class="page active">'+html+pageNav()+'</div>'}
function stat(n,t){return '<div class="card stat"><strong>'+n+'</strong><span>'+t+'</span></div>'}function projectCards(){return '<div class="grid">'+projects.map(x=>'<div class="card"><span class="tag">'+x[1]+'</span><h3>'+x[0]+'</h3><p>'+x[2]+'</p></div>').join('')+'</div>'}function newsList(){return data.news.length?data.news.map(n=>panel(n.headline,n.content||n.status)).join(''):'<div class="card"><p>News stories and announcements will appear here as they are published.</p></div>'}
function submitLocal(e,key,msg){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());obj.date=new Date().toISOString();obj.status='Pending review';data[key].push(obj);save();alert(msg+' — received locally on this device.');e.target.reset()}function memberSubmit(e){submitLocal(e,'members','Membership application')}function newsSubmit(e){submitLocal(e,'news','Story suggestion')}function partnerSubmit(e){submitLocal(e,'messages','Partnership request')}function donateSubmit(e){submitLocal(e,'messages','Donation pledge')}function contactSubmit(e){submitLocal(e,'messages','Message')}
const supabaseUrl='https://aybrkjtzsdfzjvtnjjxd.supabase.co';
const supabaseKey='sb_publishable_Cr6gBJfjI8b1H8BTuZrb1A_5Sk-qUG4';
function adminRender(){if(!user)return '<div class="page active"><h1>Admin Login</h1><p class="muted">Sign in using an account created in Supabase Authentication. Accounts must be created and assigned authorised access by the administrator.</p><form class="panel" onsubmit="loginSubmit(event)"><div class="fields"><div class="field full"><label>Email address</label><input name="Email" type="email" required></div><div class="field full"><label>Password</label><input name="Password" type="password" required></div></div><button>Sign in</button></form><button class="light" onclick="googleLogin()">Continue with Google</button><button class="light" onclick="go(\'home\')">Return to website</button></div>';return '<div class="page active"><h1>Administration</h1><p>Signed in as <b>'+esc(user)+'</b> · <button class="light" onclick="logoutAdmin()">Sign out</button></p><div class="adminnav">'+adminPages.map(x=>'<button class="'+(adminView===x?'active':'')+'" onclick="adminView=\''+x+'\';render()">'+x+'</button>').join('')+'</div>'+adminContent()+'</div>'}
async function loginSubmit(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());try{let res=await fetch(supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':supabaseKey,'Content-Type':'application/json'},body:JSON.stringify({email:v.Email,password:v.Password})});let j=await res.json();if(!res.ok)throw new Error(j.msg||j.message||j.error_description||'Sign-in failed');sessionToken=j.access_token;user=j.user.email;adminView='Dashboard';render()}catch(err){alert('Sign-in failed: '+err.message)}}
let sessionToken=null;
function googleLogin(){location.href=supabaseUrl+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.href.split('#')[0])}
function logoutAdmin(){sessionToken=null;user=null;render()}
function logoutAdmin(){user=null;render()}function adminContent(){let privileged=['francis','artness','annie'].includes(user),ed=user==='francis',treas=user==='annie';if(adminView==='Dashboard')return '<h2>Approval queue</h2><div class="panel"><p>Submissions from website forms and admin records (this browser only).</p>'+data.submissions.map((x,i)=>'<div class="card"><b>'+esc(x.title||x.form||'Submission')+'</b><p>'+esc(JSON.stringify(x.values||x))+'</p><span class="badge">'+esc(x.status)+'</span> '+(ed?'<button onclick="approve('+i+')">Approve</button> <button class="light" onclick="reject('+i+')">Reject</button>':'Awaiting ED review')+'</div>').join('')+'</div>';
if(adminView==='Members')return '<h2>Members</h2>'+tableHtml(['Name','Phone','Ward','Project','Why join'],data.members);
if(adminView==='Finance')return privileged?'<h2>Finance records</h2><p>Access: ED, Treasurer, Secretary. Demo only.</p>'+form([['Entry type','select:Income|Expense'],['Date','date'],['Amount (K)','number'],['Receipt No.','text'],['Project','text'],['Description','textarea',true]],'financeSubmit','Save finance entry')+tableHtml(['Entry type','Date','Amount (K)','Receipt No.','Project','Description'],data.finance):'<p>Restricted to ED, Treasurer and Secretary.</p>';
if(adminView==='HRM')return privileged?hrm():'<p>Restricted HRM module.</p>';
if(adminView==='55 Forms')return '<h2>55 Organisational Forms</h2><p>Templates catalog for operational use.</p>'+Object.entries({'Pathways':7,'Lady':7,'Farms':8,'Innovation':7,'Pride Works':7,'Finance':4,'Secretary':4,'ED':3,'HRM':8}).map(([k,n])=>panel(k,n+' form templates (total '+n+')')).join('');
if(adminView==='News')return '<h2>News</h2>'+form([['Headline','text'],['Content','textarea',true],['Status','select:Draft|Published']], 'adminNewsSubmit','Save news')+newsList();
if(adminView==='Gallery')return '<h2>Gallery records</h2>'+form([['Title','text'],['Description','text'],['Image reference / URL','text']], 'gallerySubmit','Add gallery record')+tableHtml(['Title','Description','Image reference / URL'],data.gallery);
if(adminView==='Docs')return '<h2>Documents register</h2>'+form([['Document title','text'],['Category','text'],['Reference','text']], 'docSubmit','Add document record')+tableHtml(['Document title','Category','Reference'],data.docs);
if(adminView==='Messages')return '<h2>Messages</h2>'+tableHtml(['Name','Phone / email','Subject','Message'],data.messages);
if(adminView==='Projects')return '<h2>Projects</h2>'+projectCards();return ''}
function tableHtml(cols,rows){return '<div class="tablewrap"><table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c]||'')+'</td>').join('')+'</tr>').join('')+'</table></div>'}
function approve(i){if(!user||user!=='francis')return alert('ED action only.');data.submissions[i].status='Approved';data.submissions[i].comment=prompt('ED comment:')||'';data.submissions[i].signature='Francis Banda';save();render()}function reject(i){if(user!=='francis')return;data.submissions[i].status='Rejected';data.submissions[i].comment=prompt('ED comment:')||'';save();render()}
function financeSubmit(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());data.finance.push(v);save();render()}function adminNewsSubmit(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());data.news.push({headline:v.Headline,content:v.Content,status:v.Status});save();render()}function gallerySubmit(e){e.preventDefault();data.gallery.push(Object.fromEntries(new FormData(e.target).entries()));save();render()}function docSubmit(e){e.preventDefault();data.docs.push(Object.fromEntries(new FormData(e.target).entries()));save();render()}

function prefillStaff(s){document.querySelectorAll('input').forEach(x=>{if(x.name==='Staff name')x.value=s});}
function staffSubmit(e){e.preventDefault();data.staff.push(Object.fromEntries(new FormData(e.target).entries()));save();render()}function contractSubmit(e){e.preventDefault();data.contracts.push(Object.fromEntries(new FormData(e.target).entries()));save();render()}function paySubmit(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());v['Net Pay']=(+v.Basic||0)+(+v.Overtime||0)+(+v.Transport||0)+(+v.Bonus||0)-(+v.Deductions||0);data.payslips.push(v);save();render()}function leaveSubmit(e){e.preventDefault();data.leave.push(Object.fromEntries(new FormData(e.target).entries()));save();render()}
async function restoreOAuth(){const h=new URLSearchParams(location.hash.slice(1));const token=h.get('access_token');if(token){sessionToken=token;try{const r=await fetch(supabaseUrl+'/auth/v1/user',{headers:{apikey:supabaseKey,Authorization:'Bearer '+token}});const j=await r.json();if(r.ok&&j.email){user=j.email;admin=true;adminView='Dashboard';location.hash='';}}catch(e){}}render()}
